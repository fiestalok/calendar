<!doctype html>
<html lang="fr" data-theme="fiestalok">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiestalok — Réservations</title>
    <script>
      (function() {
        var p = window.location.search.match(/[?&]p=([^&]*)/);
        if (p) {
          var path = decodeURIComponent(p[1]);
          var q = window.location.search.match(/[?&]q=([^&]*)/);
          var search = q ? '?' + decodeURIComponent(q[1]) : '';
          window.history.replaceState(null, null, path + search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
